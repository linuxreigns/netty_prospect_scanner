name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare data directories
        run: |
          mkdir -p data/exports data/backups

      - name: Lint (ruff)
        run: |
          python -m ruff check app dashboard tests

      - name: Format check (black)
        run: |
          python -m black --check app dashboard tests

      - name: Import order check (isort)
        run: |
          python -m isort --check-only app dashboard tests

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Compile check
        run: |
          python -m compileall app dashboard tests

      - name: Tests
        env:
          ENABLE_PLAYWRIGHT_FALLBACK: "false"
        run: |
          set -o pipefail
          python -m pytest -v --tb=long
