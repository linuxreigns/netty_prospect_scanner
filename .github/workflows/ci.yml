name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare data directories
        run: |
          mkdir -p data/exports data/backups

      - name: Lint (ruff)
        run: |
          ruff check app dashboard tests

      - name: Format check (black)
        run: |
          black --check app dashboard tests

      - name: Import order check (isort)
        run: |
          isort --check-only app dashboard tests

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Compile check
        run: |
          python -m compileall app dashboard tests

      - name: Verify app imports
        run: |
          python -c "from app.main import app; print('app import OK')"

      - name: Diagnose environment
        run: |
          python --version
          pip show fastapi starlette pytest httpx 2>/dev/null | grep -E "^(Name|Version):"
          echo "CWD: $(pwd)"
          ls -la data/

      - name: Tests
        env:
          ENABLE_PLAYWRIGHT_FALLBACK: "false"
        run: |
          pytest -v --tb=long -p no:warnings 2>&1 | tee /tmp/pytest_output.txt
          exit ${PIPESTATUS[0]}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: /tmp/pytest_output.txt
